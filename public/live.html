<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="{{CANONICAL_URL}}">
<meta name="robots" content="{{ROBOTS}}">
<meta property="og:site_name" content="Wisecall">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:type" content="{{OG_TYPE}}">
<meta property="og:url" content="{{CANONICAL_URL}}">
<meta property="og:image" content="{{PUBLIC_URL}}/og-image-1200x630.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Wisecall — Advice from people who've already done it.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{DESCRIPTION}}">
<meta name="twitter:image" content="{{PUBLIC_URL}}/og-image-1200x630.png">
<meta name="twitter:image:alt" content="Wisecall — Advice from people who've already done it.">
<link rel="preload" href="/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/baloo2-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/home.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<script src="/js/header.js"></script>

<main class="advice live-list-page container" id="main">
  <nav class="breadcrumb" aria-label="Breadcrumb">
    <ol>
      <li><a href="{{PREFIX}}/">{{HOME}}</a></li>
      <li><span aria-current="page">{{H1}}</span></li>
    </ol>
  </nav>
  <header class="advice-head"><div><h1>{{H1}}</h1><p class="advice-intro">{{INTRO}}</p></div></header>
  <form class="live-filters" method="get" action="{{PREFIX}}/live" role="search" aria-label="{{H1}}">
    <label for="lfField"><span class="small">{{F_FIELD}}</span><select id="lfField" name="field"><option value="">{{F_ANY}}</option>{{FIELD_OPTIONS}}</select></label>
    <label for="lfLanguage"><span class="small">{{F_LANGUAGE}}</span><select id="lfLanguage" name="language"><option value="">{{F_ANY}}</option>{{LANGUAGE_OPTIONS}}</select></label>
    <label for="lfType"><span class="small">{{F_TYPE}}</span><select id="lfType" name="type"><option value="">{{F_ANY}}</option>{{TYPE_OPTIONS}}</select></label>
    <label for="lfFrom"><span class="small">{{F_FROM}}</span><input type="date" id="lfFrom" name="from" value="{{FROM}}"></label>
    <label for="lfTo"><span class="small">{{F_TO}}</span><input type="date" id="lfTo" name="to" value="{{TO}}"></label>
    <label for="lfPrice"><span class="small">{{F_PRICE}}</span><input type="number" id="lfPrice" name="maxPrice" min="5" max="200" step="1" inputmode="numeric" value="{{MAX_PRICE}}"></label>
    <button type="submit" class="btn btn-outline">{{F_APPLY}}</button>
  </form>
  <section class="live-grid" aria-label="{{H1}}">{{LIST}}</section>
  <p class="live-host-cta"><a class="plain-link" href="/dashboard.html?tab=live">{{HOST}}</a></p>
</main>

<script src="/js/i18n.js"></script>
<script src="/js/footer.js"></script>
<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/live-list.js"></script>
</body>
</html>
