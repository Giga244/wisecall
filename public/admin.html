<body>

<script src="/js/header.js"></script>

<main class="dash container" id="main">
  <h1 data-i18n="admin.pageTitle">Admin</h1>
  <p class="launch-banner launch-banner-admin" id="adminLaunchNote" data-i18n="admin.launch.banner" hidden></p>
  <div class="filters" id="adminTabs" style="margin-bottom: 18px;" role="tablist">
    <button class="chip active" data-tab="mentors" role="tab" data-i18n="admin.tab.mentors">Mentor applications</button>
    <button class="chip" data-tab="bookings" role="tab" data-i18n="admin.tab.bookings">Bookings and refunds</button>
    <button class="chip" data-tab="queue" role="tab" data-i18n="admin.tab.queue">Review queue</button>
    <button class="chip" data-tab="reviews" role="tab" data-i18n="admin.tab.reviews">Reviews</button>
    <button class="chip" data-tab="interviews" role="tab" data-i18n="admin.tab.interviews">Video interviews</button>
    <button class="chip" data-tab="payouts" role="tab" data-i18n="admin.tab.payouts">Payouts</button>
    <button class="chip" data-tab="waitlist" role="tab" data-i18n="admin.tab.waitlist">Waiting list</button>
    <button class="chip" data-tab="niches" role="tab" data-i18n="admin.tab.niches">Niches</button>
    <button class="chip" data-tab="disputes" role="tab" data-i18n="admin.tab.disputes">Disputes</button>
    <button class="chip" data-tab="support" role="tab" data-i18n="admin.tab.support">Support</button>
    <button class="chip" data-tab="answers" role="tab" data-i18n="admin.tab.answers">Public answers</button>
    <button class="chip" data-tab="requests" role="tab" data-i18n="admin.tab.requests">Mentor requests</button>
    <button class="chip" data-tab="overview" role="tab" data-i18n="admin.tab.overview">Overview</button>
  </div>
  <div class="filters" id="statusFilters" style="margin-bottom: 28px;"></div>
  <div id="adminContent"><p class="muted" data-i18n="experts.loading">Loading…</p></div>
</main>

<div class="toast" id="toast"></div>

<script src="/js/i18n.js"></script>
