<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="{{CANONICAL_URL}}">
<meta name="robots" content="{{ROBOTS}}">
<meta property="og:site_name" content="Wisecall">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:type" content="profile">
<meta property="og:url" content="{{CANONICAL_URL}}">
<meta property="og:image" content="{{PUBLIC_URL}}/og-image-1200x630.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Wisecall — Advice from people who've already done it.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{DESCRIPTION}}">
<meta name="twitter:image" content="{{PUBLIC_URL}}/og-image-1200x630.png">
<meta name="twitter:image:alt" content="Wisecall — Advice from people who've already done it.">
<link rel="preload" href="/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/baloo2-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<script src="/js/header.js"></script>

<main class="expert-wrap container" id="main">
  <nav class="breadcrumb" aria-label="Breadcrumb" id="crumbs"></nav>
  <div id="expertPage" aria-live="polite" aria-busy="true">
    <div class="expert-layout" aria-hidden="true">
      <div class="profile-card">
        <div class="profile-head">
          <span class="skeleton skeleton-avatar"></span>
          <div style="flex:1"><span class="skeleton skeleton-title"></span><span class="skeleton skeleton-line w60"></span></div>
        </div>
        <span class="skeleton skeleton-line w80" style="margin-top:24px"></span>
      </div>
      <div class="ask-side"><div class="skeleton-card"><span class="skeleton skeleton-title"></span><span class="skeleton skeleton-line"></span><span class="skeleton skeleton-line w80"></span><span class="skeleton skeleton-line w60"></span></div></div>
    </div>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/js/i18n.js"></script>
<script src="/js/footer.js"></script>
<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/badges.js"></script>
<script src="/js/report.js"></script>
<script src="/js/ratings.js"></script>
<script src="/js/sheet.js"></script>
<script src="/js/waitlist.js"></script>
<script src="/js/profile.js"></script>
</body>
</html>
