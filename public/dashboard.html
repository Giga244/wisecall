<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dashboard — Wisecall</title>
<meta name="description" content="Your questions, answers and earnings on Wisecall.">
<link rel="canonical" href="{{PUBLIC_URL}}/dashboard.html">
<meta name="robots" content="noindex">
<meta property="og:site_name" content="Wisecall">
<meta property="og:title" content="Dashboard — Wisecall">
<meta property="og:description" content="Your questions, answers and earnings on Wisecall.">
<meta property="og:type" content="website">
<meta property="og:url" content="{{PUBLIC_URL}}/dashboard.html">
<meta property="og:image" content="{{PUBLIC_URL}}/og-image-1200x630.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Wisecall — Advice from people who've already done it.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Dashboard — Wisecall">
<meta name="twitter:description" content="Your questions, answers and earnings on Wisecall.">
<meta name="twitter:image" content="{{PUBLIC_URL}}/og-image-1200x630.png">
<meta name="twitter:image:alt" content="Wisecall — Advice from people who've already done it.">
<link rel="preload" href="/fonts/onest-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<script src="/js/header.js"></script>

<main class="dash container" id="main">
  <nav class="breadcrumb" aria-label="Breadcrumb">
    <ol>
      <li><a href="/index.html" data-i18n="expert.crumb.home">Home</a></li>
      <li><span aria-current="page" data-i18n="dash.title">Dashboard</span></li>
    </ol>
  </nav>

  <div class="page-head">
    <h1 data-i18n="dash.title">Dashboard</h1>
    <p data-i18n="dash.sub">Your questions, answers and earnings in one place.</p>
    <p class="need-help small"><a class="plain-link" href="/contact.html" data-i18n="help.need">Need help? Contact us</a></p>
  </div>

  <!-- (the way to the mentor application, for someone who is not a mentor yet: public/js/dashboard.js) -->
  <div id="emailCodeBanner" hidden></div>
  <div id="mentorCard"></div>

  <div class="tabs" id="dashTabs" role="tablist" data-i18n-aria="dash.tabsLabel" aria-label="Dashboard sections">
    <button type="button" class="tab" role="tab" id="tab-asked" aria-controls="panel-asked" data-tab="asked" data-i18n="dash.tab.asked">My questions</button>
    <button type="button" class="tab" role="tab" id="tab-received" aria-controls="panel-received" data-tab="received" hidden><span data-i18n="dash.tab.received">Questions for me</span> <span class="tab-count" id="receivedCount" hidden></span></button>
    <button type="button" class="tab" role="tab" id="tab-earnings" aria-controls="panel-earnings" data-tab="earnings" hidden data-i18n="dash.tab.earnings">Earnings</button>
    <!-- live -->
    <button type="button" class="tab" role="tab" id="tab-live" aria-controls="panel-live" data-tab="live" data-i18n="dash.tab.live">Live sessions</button>
    <!-- /live -->
  </div>

  <div class="tab-panel" role="tabpanel" id="panel-asked" aria-labelledby="tab-asked" data-panel="asked">
    <!-- (while the questions are on their way: two as skeletons, and one "Loading…" for screen readers) -->
    <div id="askedList" aria-live="polite" aria-busy="true">
      <p class="sr-only" role="status" data-i18n="experts.loading">Loading…</p>
      <div class="booking-card skeleton-booking" aria-hidden="true">
        <div class="booking-top"><span class="skeleton skeleton-avatar sm"></span><div class="skeleton-stack"><span class="skeleton skeleton-name w60"></span><span class="skeleton skeleton-pill"></span></div><span class="skeleton skeleton-price"></span></div>
        <ol class="timeline"><li><span class="skeleton skeleton-dot"></span><span class="skeleton skeleton-line"></span></li><li><span class="skeleton skeleton-dot"></span><span class="skeleton skeleton-line"></span></li><li><span class="skeleton skeleton-dot"></span><span class="skeleton skeleton-line"></span></li><li><span class="skeleton skeleton-dot"></span><span class="skeleton skeleton-line"></span></li></ol>
        <span class="skeleton skeleton-line"></span><span class="skeleton skeleton-line w90"></span><span class="skeleton skeleton-line w40"></span>
      </div>
      <div class="booking-card skeleton-booking" aria-hidden="true">
        <div class="booking-top"><span class="skeleton skeleton-avatar sm"></span><div class="skeleton-stack"><span class="skeleton skeleton-name w60"></span><span class="skeleton skeleton-pill"></span></div><span class="skeleton skeleton-price"></span></div>
        <ol class="timeline"><li><span class="skeleton skeleton-dot"></span><span class="skeleton skeleton-line"></span></li><li><span class="skeleton skeleton-dot"></span><span class="skeleton skeleton-line"></span></li><li><span class="skeleton skeleton-dot"></span><span class="skeleton skeleton-line"></span></li><li><span class="skeleton skeleton-dot"></span><span class="skeleton skeleton-line"></span></li></ol>
        <span class="skeleton skeleton-line"></span><span class="skeleton skeleton-line w90"></span><span class="skeleton skeleton-line w40"></span>
      </div>
    </div>
  </div>
  <div class="tab-panel" role="tabpanel" id="panel-received" aria-labelledby="tab-received" data-panel="received" hidden>
    <div id="receivedList" aria-live="polite"></div>
    <!-- (below the questions: a mentor comes here to answer, docs/FLOW-REVIEW.md 1) -->
    <p class="small great-answer-link"><a class="plain-link" href="/help/write-a-great-answer" data-i18n="help.greatAnswer">How to write a great answer</a></p>
    <div id="shareCard" hidden></div>
  </div>
  <div class="tab-panel" role="tabpanel" id="panel-earnings" aria-labelledby="tab-earnings" data-panel="earnings" hidden>
    <div id="earnings"></div>
  </div>
  <!-- live -->
  <div class="tab-panel" role="tabpanel" id="panel-live" aria-labelledby="tab-live" data-panel="live" hidden>
    <div id="liveBox" aria-live="polite"></div>
  </div>
  <!-- /live -->
  <!-- (the price: on every tab, below what the mentor came for) -->
  <div id="priceBlock" hidden></div>
  <!-- Sample answers: the team's questions an approved mentor can answer before launch (public/js/dashboard-samples.js) -->
  <section class="settings-card dash-samples" id="sampleAnswers" aria-labelledby="sampleAnswersTitle" hidden></section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/js/i18n.js"></script>
<script src="/js/footer.js"></script>
<script src="/js/api.js"></script>
<script src="/js/dialog.js"></script>
<script src="/js/copy-link.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/report.js"></script>
<script src="/js/ratings.js"></script>
<script src="/js/balance.js"></script>
<script src="/js/public-answers.js"></script>
<!-- live --><script src="/js/live-dashboard.js"></script><!-- /live -->
<script src="/js/id-card.js"></script>
<script src="/js/price-block.js"></script>
<script src="/js/email-code.js"></script>
<script src="/js/dashboard.js"></script>
<script src="/js/dashboard-samples.js"></script>
</body>
</html>
