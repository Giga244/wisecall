<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="description" content="Verify your email address to finish setting up your Wisecall account.">
<link rel="canonical" href="{{PUBLIC_URL}}/verify-email.html">
<meta name="robots" content="noindex">
<meta property="og:site_name" content="Wisecall">
<meta property="og:title" content="Verify your email — Wisecall">
<meta property="og:description" content="Verify your email address to finish setting up your Wisecall account.">
<meta property="og:type" content="website">
<meta property="og:url" content="{{PUBLIC_URL}}/verify-email.html">
<meta property="og:image" content="{{PUBLIC_URL}}/og-image-1200x630.png">
<meta property="og:image:width" content="1200">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Verify your email — Wisecall">
<meta name="twitter:description" content="Verify your email address to finish setting up your Wisecall account.">
<meta name="twitter:image" content="{{PUBLIC_URL}}/og-image-1200x630.png">
<meta name="twitter:image:alt" content="Wisecall — Advice from people who've already done it.">
<link rel="preload" href="/fonts/onest-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<script src="/js/header.js"></script>

<main class="auth-page" id="main">
  <div class="auth-card">
    <h1 data-i18n="auth.verify.title">Verify your email</h1>
    <p class="muted" id="verifySub" data-i18n="auth.verify.sub">Enter the 6-digit code we sent you.</p>
    <div id="devCodeBox" style="display:none; margin-bottom: 16px;"></div>
    <form id="verifyForm">
      <label for="code"><span data-i18n="auth.verify.codeLabel">Verification code</span>
        <input type="text" id="code" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" maxlength="6" placeholder="000000" required>
      </label>
      <p class="form-error" id="formError" role="alert"></p>
      <button type="submit" class="btn btn-primary btn-block" data-i18n="auth.verify.cta">Verify</button>
    </form>
    <p class="auth-switch">
      <span data-i18n="auth.verify.noCode">Didn't get a code?</span>
      <a href="#" id="resendLink" data-i18n="auth.verify.resend">Resend it</a>
    </p>
    <p class="auth-switch"><a href="/dashboard.html" data-i18n="auth.verify.skip">Skip for now</a></p>
  </div>
</main>

<div class="toast" id="toast"></div>

<script src="/js/i18n.js"></script>
<script src="/js/footer.js"></script>
<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/verify-email.js"></script>
</body>
</html>
