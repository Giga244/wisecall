<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify your email — Wisecall</title>
<meta name="description" content="Verify your email address to finish setting up your Wisecall account.">
<link rel="canonical" href="{{APP_URL}}/verify-email.html">
<meta name="robots" content="noindex">
<meta property="og:site_name" content="Wisecall">
<meta property="og:title" content="Verify your email — Wisecall">
<meta property="og:description" content="Verify your email address to finish setting up your Wisecall account.">
<meta property="og:type" content="website">
<meta property="og:url" content="{{APP_URL}}/verify-email.html">
<meta property="og:image" content="{{APP_URL}}/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Wisecall: advice from people who have already done it">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Verify your email — Wisecall">
<meta name="twitter:description" content="Verify your email address to finish setting up your Wisecall account.">
<meta name="twitter:image" content="{{APP_URL}}/og-image.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="nav">
  <div class="container nav-inner">
    <a href="/index.html" class="logo">Wisecall<span class="dot">.</span></a>
    <div class="nav-right">
      <div class="lang-toggle">
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="ka">KA</button>
      </div>
    </div>
  </div>
</header>

<section class="auth-page">
  <div class="auth-card">
    <h1 data-i18n="auth.verify.title">Verify your email</h1>
    <p class="muted" id="verifySub" data-i18n="auth.verify.sub">Enter the 6-digit code we sent you.</p>
    <div id="devCodeBox" style="display:none; margin-bottom: 16px;"></div>
    <form id="verifyForm">
      <label><span data-i18n="auth.verify.codeLabel">Verification code</span>
        <input type="text" id="code" inputmode="numeric" maxlength="6" placeholder="000000" required>
      </label>
      <p class="form-error" id="formError"></p>
      <button type="submit" class="btn btn-primary btn-block" data-i18n="auth.verify.cta">Verify</button>
    </form>
    <p class="auth-switch">
      <span data-i18n="auth.verify.noCode">Didn't get a code?</span>
      <a href="#" id="resendLink" data-i18n="auth.verify.resend">Resend it</a>
    </p>
    <p class="auth-switch"><a href="/dashboard.html" data-i18n="auth.verify.skip">Skip for now</a></p>
  </div>
</section>

<div class="toast" id="toast"></div>

<script src="/js/i18n.js"></script>
<script src="/js/footer.js"></script>
<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/verify-email.js"></script>
</body>
</html>
