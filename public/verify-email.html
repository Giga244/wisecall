<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify your email — Wisecall</title>
<meta name="description" content="Verify your email address to finish setting up your Wisecall account.">
<link rel="canonical" href="{{APP_URL}}/verify-email.html">
<meta name="robots" content="noindex">
<meta property="og:site_name" content="Wisecall">
<meta property="og:title" content="Verify your email — Wisecall">
<meta property="og:description" content="Verify your email address to finish setting up your Wisecall account.">
<meta property="og:type" content="website">
<meta property="og:url" content="{{APP_URL}}/verify-email.html">
<meta property="og:image" content="{{APP_URL}}/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Wisecall: advice from people who have already done it">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Verify your email — Wisecall">
<meta name="twitter:description" content="Verify your email address to finish setting up your Wisecall account.">
<meta name="twitter:image" content="{{APP_URL}}/og-image.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="nav">
  <div class="container nav-inner">
    <a href="/index.html" class="logo">Wisecall<span class="dot">.</span></a>
    <div class="nav-right">
      <div class="lang-toggle">
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="ka">KA</button>
      </div>
    </div>
  </div>
</header>

<section class="auth-page">
  <div class="auth-card">
    <h1 data-i18n="auth.verify.title">Verify your email</h1>
    <p class="muted" id="verifySub" data-i18n="auth.verify.sub">Enter the 6-digit code we sent you.</p>
    <div id="devCodeBox" style="display:none; margin-bottom: 16px;"></div>
    <form id="verifyForm">
      <label><span data-i18n="auth.verify.codeLabel">Verification code</span>
        <input type="text" id="code" inputmode="numeric" maxlength="6" placeholder="000000" required>
      </label>
      <p class="form-error" id="formError"></p>
      <button type="submit" class="btn btn-primary btn-block" data-i18n="auth.verify.cta">Verify</button>
    </form>
    <p class="auth-switch">
      <span data-i18n="auth.verify.noCode">Didn't get a code?</span>
      <a href="#" id="resendLink" data-i18n="auth.verify.resend">Resend it</a>
    </p>
    <p class="auth-switch"><a href="/dashboard.html" data-i18n="auth.verify.skip">Skip for now</a></p>
  </div>
</section>

<div class="toast" id="toast"></div>

<script src="/js/i18n.js"></script>
<script src="/js/footer.js"></script>
<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script>
(async function () {
  await WisecallI18n.initI18n();
  const user = await WisecallNav.initNav();
  if (!user) { window.location.href = '/login.html?redirect=/verify-email.html'; return; }

  const params = new URLSearchParams(location.search);
  const redirect = WisecallAPI.safeRedirect(params.get('redirect'), '/dashboard.html');
  const form = document.getElementById('verifyForm');
  const errorEl = document.getElementById('formError');
  const devCodeBox = document.getElementById('devCodeBox');

  if (user.emailVerified) {
    window.location.href = redirect;
    return;
  }

  const devCode = (params.get('devCode') || '').replace(/\D/g, '').slice(0, 6);
  if (devCode) {
    devCodeBox.style.display = 'block';
    devCodeBox.innerHTML = `<div class="hero-cta-banner">${WisecallI18n.t('auth.verify.devModeNote')} <strong class="mono">${devCode}</strong></div>`;
  }

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    errorEl.textContent = '';
    const submitBtn = form.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    try {
      await WisecallAPI.apiFetch('/auth/verify-email', { method: 'POST', body: { code: document.getElementById('code').value.trim() } });
      WisecallNav.showToast(WisecallI18n.t('auth.verify.success'));
      window.location.href = redirect;
    } catch (e) {
      const map = { invalid_code: 'auth.verify.invalidCode', expired: 'auth.verify.expiredCode', no_pending_code: 'auth.verify.noPendingCode' };
      errorEl.textContent = WisecallI18n.t(map[e.code] || 'toast.error');
      submitBtn.disabled = false;
    }
  });

  document.getElementById('resendLink').addEventListener('click', async (ev) => {
    ev.preventDefault();
    try {
      const data = await WisecallAPI.apiFetch('/auth/resend-verification', { method: 'POST' });
      if (data.devMode && data.devVerifyCode) {
        devCodeBox.style.display = 'block';
        devCodeBox.innerHTML = `<div class="hero-cta-banner">${WisecallI18n.t('auth.verify.devModeNote')} <strong class="mono">${data.devVerifyCode}</strong></div>`;
      }
      WisecallNav.showToast(WisecallI18n.t('auth.verify.resent'));
    } catch (e) {
      WisecallNav.showToast(WisecallI18n.t('toast.error'));
    }
  });
})();
</script>
</body>
</html>
