<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="{{CANONICAL_URL}}">
<meta name="robots" content="{{ROBOTS}}">
<meta property="og:site_name" content="Wisecall">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:type" content="{{OG_TYPE}}">
<meta property="og:url" content="{{CANONICAL_URL}}">
<meta property="og:image" content="{{PUBLIC_URL}}/og-image-1200x630.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Wisecall — Advice from people who've already done it.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{DESCRIPTION}}">
<meta name="twitter:image" content="{{PUBLIC_URL}}/og-image-1200x630.png">
<meta name="twitter:image:alt" content="Wisecall — Advice from people who've already done it.">
<link rel="preload" href="/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/baloo2-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/home.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<script src="/js/header.js"></script>

<main class="advice answers container" id="main">
  <nav class="breadcrumb" aria-label="Breadcrumb">
    <ol>
      <li><a href="{{PREFIX}}/">{{HOME}}</a></li>
      <li><span aria-current="page">{{H1}}</span></li>
    </ol>
  </nav>
  <header class="advice-head"><div><h1>{{H1}}</h1><p class="advice-intro">{{INTRO}}</p></div></header>
  <form class="answers-search" method="get" action="{{PREFIX}}/answers" role="search">
    <label class="sr-only" for="answersQ">{{SEARCH}}</label>
    <input type="search" id="answersQ" name="q" value="{{Q}}" placeholder="{{SEARCH}}" maxlength="100">
    <label class="sr-only" for="answersNiche">{{FIELD}}</label>
    <select id="answersNiche" name="niche">{{NICHE_OPTIONS}}</select>
    <label class="sr-only" for="answersSort">{{SORT}}</label>
    <select id="answersSort" name="sort">{{SORT_OPTIONS}}</select>
    <button type="submit" class="btn btn-primary btn-sm">{{SEARCH_BUTTON}}</button>
  </form>
  <section class="answers-list" aria-label="{{H1}}">{{LIST}}</section>
  <p class="muted small">{{NOTE}}</p>
</main>

<script src="/js/i18n.js"></script>
<script src="/js/footer.js"></script>
<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/answers.js"></script>
</body>
</html>
