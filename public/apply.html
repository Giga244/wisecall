<!-- The mentor application, one step at a time (docs/CLAUDE-CODE-MENTOR-SIGNUP.md #3, docs/CLAUDE-CODE-UX-WALKTHROUGH.md A): each step is
     saved on its own, and the mentor can leave and come back. public/js/apply.js draws the steps; the server decides every rule. -->
<main class="apply container" id="main">
  <nav class="breadcrumb" aria-label="Breadcrumb">
    <ol>
      <li><a href="/index.html" data-i18n="expert.crumb.home">Home</a></li>
      <li><span aria-current="page" data-i18n="apply.crumb">Mentor application</span></li>
    </ol>
  </nav>
  <header class="apply-head" id="applyHead" hidden>
    <p class="apply-progress-text" id="applyProgressText"></p>
    <div class="vt-bar apply-bar" id="applyBar" role="progressbar" aria-valuemin="1" aria-valuemax="5" aria-valuenow="1"><span></span></div>
    <ol class="apply-steps" id="applySteps"></ol>
  </header>
  <section class="apply-card" id="applyRoot" aria-live="polite">
    <p class="muted" data-i18n="admin.loading">Loading…</p>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
