<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — Wisecall</title>
<meta name="description" content="Reset your Wisecall password.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="nav">
  <div class="container nav-inner">
    <a href="/index.html" class="logo">Wisecall<span class="dot">.</span></a>
    <div class="nav-right">
      <div class="lang-toggle">
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="ka">KA</button>
      </div>
    </div>
  </div>
</header>

<section class="auth-page">
  <div class="auth-card">
    <h1 data-i18n="auth.forgot.title">Reset your password</h1>
    <p class="muted" data-i18n="auth.forgot.sub">Enter your account email and we'll send you a reset link.</p>
    <form id="forgotForm">
      <label><span data-i18n="auth.field.email">Email</span>
        <input type="email" id="email" required>
      </label>
      <p class="form-error" id="formError"></p>
      <button type="submit" class="btn btn-primary btn-block" data-i18n="auth.forgot.cta">Send reset link</button>
    </form>
    <div id="result" style="display:none"></div>
    <p class="auth-switch">
      <a href="/login.html" data-i18n="auth.forgot.back">Back to log in</a>
    </p>
  </div>
</section>

<div class="toast" id="toast"></div>

<script src="/js/i18n.js"></script>
<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script>
(async function () {
  const dict = await SagelyI18n.initI18n();
  const form = document.getElementById('forgotForm');
  const errorEl = document.getElementById('formError');
  const resultEl = document.getElementById('result');

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    errorEl.textContent = '';
    const submitBtn = form.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    try {
      const data = await SagelyAPI.apiFetch('/auth/forgot-password', {
        method: 'POST',
        body: { email: document.getElementById('email').value.trim() }
      });
      form.style.display = 'none';
      resultEl.style.display = 'block';
      if (data.devMode) {
        if (data.resetUrl) {
          resultEl.innerHTML = `
            <p class="muted small" style="margin-bottom:10px">${SagelyI18n.t('auth.forgot.devModeNote')}</p>
            <a class="btn btn-outline btn-block" href="${data.resetUrl}">${SagelyI18n.t('auth.forgot.devModeLink')}</a>
          `;
        } else {
          resultEl.innerHTML = `<p class="muted">${SagelyI18n.t('auth.forgot.devModeNoAccount')}</p>`;
        }
      } else {
        resultEl.innerHTML = `<p class="muted">${SagelyI18n.t('auth.forgot.sent')}</p>`;
      }
    } catch (e) {
      errorEl.textContent = SagelyI18n.t('toast.error');
      submitBtn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
