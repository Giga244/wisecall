<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Reset password — Wisecall</title>
<meta name="description" content="Reset your Wisecall password.">
<link rel="canonical" href="{{PUBLIC_URL}}/forgot-password.html">
<meta name="robots" content="noindex">
<meta property="og:site_name" content="Wisecall">
<meta property="og:title" content="Reset password — Wisecall">
<meta property="og:description" content="Reset your Wisecall password.">
<meta property="og:type" content="website">
<meta property="og:url" content="{{PUBLIC_URL}}/forgot-password.html">
<meta property="og:image" content="{{PUBLIC_URL}}/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Wisecall: advice from people who have already done it">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Reset password — Wisecall">
<meta name="twitter:description" content="Reset your Wisecall password.">
<meta name="twitter:image" content="{{PUBLIC_URL}}/og-image.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/baloo2-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<script src="/js/header.js"></script>

<main class="auth-page" id="main">
  <div class="auth-card">
    <h1 data-i18n="auth.forgot.title">Reset your password</h1>
    <p class="muted" data-i18n="auth.forgot.sub">Enter your account email and we'll send you a reset link.</p>
    <form id="forgotForm">
      <label><span data-i18n="auth.field.email">Email</span>
        <input type="email" id="email" required>
      </label>
      <p class="form-error" id="formError" role="alert"></p>
      <button type="submit" class="btn btn-primary btn-block" data-i18n="auth.forgot.cta">Send reset link</button>
    </form>
    <div id="result" style="display:none"></div>
    <p class="auth-switch">
      <a href="/login.html" data-i18n="auth.forgot.back">Back to log in</a>
    </p>
  </div>
</main>

<div class="toast" id="toast"></div>

<script src="/js/i18n.js"></script>
<script src="/js/footer.js"></script>
<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/forgot-password.js"></script>
</body>
</html>
