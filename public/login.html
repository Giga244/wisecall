<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Wisecall</title>
<meta name="description" content="Log in to Wisecall to ask experts questions or answer them.">
<link rel="canonical" href="{{PUBLIC_URL}}/login.html">
<meta property="og:site_name" content="Wisecall">
<meta property="og:title" content="Log in — Wisecall">
<meta property="og:description" content="Log in to Wisecall to ask experts questions or answer them.">
<meta property="og:type" content="website">
<meta property="og:url" content="{{PUBLIC_URL}}/login.html">
<meta property="og:image" content="{{PUBLIC_URL}}/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Wisecall: advice from people who have already done it">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Log in — Wisecall">
<meta name="twitter:description" content="Log in to Wisecall to ask experts questions or answer them.">
<meta name="twitter:image" content="{{PUBLIC_URL}}/og-image.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/baloo2-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<script src="/js/header.js"></script>

<main class="auth-split" id="main">
  <aside class="auth-panel">
    <span class="auth-blob a1"></span><span class="auth-blob a2"></span>
    <h2 data-i18n="auth.panel.login.title">Good to see you again</h2>
    <ul class="auth-benefits">
      <li><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4V5z"/><path d="M9 10.5l2 2 4-4"/></svg><span data-i18n="auth.panel.login.1">Follow your questions and answers in one dashboard.</span></li>
      <li><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span data-i18n="auth.panel.login.2">Mentors: answer questions and track your earnings.</span></li>
      <li><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M7 15h3"/></svg><span data-i18n="auth.panel.login.3">Your card number never touches Wisecall.</span></li>
    </ul>
  </aside>

  <section class="auth-card" aria-labelledby="authTitle">
    <h1 id="authTitle" data-i18n="auth.login.title">Welcome back</h1>
    <p class="muted" data-i18n="auth.login.sub">Log in to ask a question or answer one.</p>
    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email" data-i18n="auth.field.email">Email</label>
        <input type="email" id="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password" data-i18n="auth.field.password">Password</label>
        <div class="pw-wrap">
          <input type="password" id="password" autocomplete="current-password" required minlength="8">
          <button type="button" class="pw-toggle" aria-controls="password" aria-pressed="false" data-i18n-aria="auth.pw.show" aria-label="Show password">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <p class="forgot-row"><a href="/forgot-password.html" data-i18n="auth.login.forgot">Forgot password?</a></p>
      <p class="form-error" id="formError" role="alert"></p>
      <button type="submit" class="btn btn-primary btn-block" data-i18n="auth.login.cta">Log in</button>
    </form>
    <p class="auth-switch">
      <span data-i18n="auth.login.noAccount">Don't have an account?</span>
      <a href="/signup.html" data-i18n="auth.login.createOne">Create one</a>
    </p>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/js/i18n.js"></script>
<script src="/js/footer.js"></script>
<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/auth-ui.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
