<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test ID check — Wisecall (development only)</title>
<meta name="description" content="A fake ID-check page used only while developing Wisecall. It does not exist in production.">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="nav">
  <div class="container nav-inner">
    <a href="/index.html" class="logo">Wisecall<span class="dot">.</span></a>
    <div class="nav-right">
      <div class="lang-toggle">
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="ka">KA</button>
      </div>
    </div>
  </div>
</header>

<section class="auth-page">
  <div class="auth-card">
    <p class="badge badge-pending_payment" data-i18n="mockbank.badge">Development only</p>
    <h1 data-i18n="mockkyc.title">Test ID check</h1>
    <p class="muted" data-i18n="mockkyc.sub">This pretends to be the ID-verification provider. No document is looked at. Choose what result you want to simulate.</p>
    <form id="mockKycForm">
      <label><span data-i18n="mockkyc.name">Full name on the ID</span>
        <input type="text" id="fullName" maxlength="100" autocomplete="off">
      </label>
      <label><span data-i18n="mockkyc.dob">Date of birth</span>
        <input type="date" id="dob" value="1990-01-01">
      </label>
      <label><span data-i18n="mockkyc.outcome">Result</span>
        <select id="outcome">
          <option value="approve" data-i18n="mockkyc.approve">Approved</option>
          <option value="review" data-i18n="mockkyc.review">Needs manual review at the provider</option>
          <option value="decline" data-i18n="mockkyc.decline">Declined</option>
        </select>
      </label>
      <p class="form-error" id="mockError" role="alert"></p>
      <button type="submit" class="btn btn-primary btn-block" data-i18n="mockkyc.submit">Finish the ID check</button>
    </form>
  </div>
</section>

<script src="/js/i18n.js"></script>
<script src="/js/footer.js"></script>
<script src="/js/api.js"></script>
<script src="/js/mock-kyc.js"></script>
</body>
</html>
