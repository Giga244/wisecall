<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<script src="/js/header.js"></script>

<main class="auth-page" id="main">
  <div class="auth-card">
    <h1 data-i18n="auth.reset.title">Set a new password</h1>
    <p class="muted" data-i18n="auth.reset.sub">Choose a new password for your account.</p>
    <form id="resetForm">
      <label><span data-i18n="settings.password.new">New password</span>
        <input type="password" id="newPassword" required minlength="8">
      </label>
      <p class="form-error" id="formError" role="alert"></p>
      <button type="submit" class="btn btn-primary btn-block" data-i18n="auth.reset.cta">Update password</button>
    </form>
    <div id="result" style="display:none"></div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script src="/js/i18n.js"></script>
<script src="/js/footer.js"></script>
<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/reset-password.js"></script>
</body>
