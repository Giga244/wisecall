<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set a new password — Wisecall</title>
<meta name="description" content="Choose a new password for your Wisecall account.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="nav">
  <div class="container nav-inner">
    <a href="/index.html" class="logo">Wisecall<span class="dot">.</span></a>
    <div class="nav-right">
      <div class="lang-toggle">
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="ka">KA</button>
      </div>
    </div>
  </div>
</header>

<section class="auth-page">
  <div class="auth-card">
    <h1 data-i18n="auth.reset.title">Set a new password</h1>
    <p class="muted" data-i18n="auth.reset.sub">Choose a new password for your account.</p>
    <form id="resetForm">
      <label><span data-i18n="settings.password.new">New password</span>
        <input type="password" id="newPassword" required minlength="8">
      </label>
      <p class="form-error" id="formError"></p>
      <button type="submit" class="btn btn-primary btn-block" data-i18n="auth.reset.cta">Update password</button>
    </form>
    <div id="result" style="display:none"></div>
  </div>
</section>

<div class="toast" id="toast"></div>

<script src="/js/i18n.js"></script>
<script src="/js/footer.js"></script>
<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script>
(async function () {
  await WisecallI18n.initI18n();
  const form = document.getElementById('resetForm');
  const errorEl = document.getElementById('formError');
  const resultEl = document.getElementById('result');
  const params = new URLSearchParams(location.search);
  const token = params.get('token');

  if (!token) {
    form.style.display = 'none';
    resultEl.style.display = 'block';
    resultEl.innerHTML = `<p class="muted">${WisecallI18n.t('auth.reset.noToken')}</p>`;
    return;
  }

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    errorEl.textContent = '';
    const submitBtn = form.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    try {
      await WisecallAPI.apiFetch('/auth/reset-password', {
        method: 'POST',
        body: { token, newPassword: document.getElementById('newPassword').value }
      });
      form.style.display = 'none';
      resultEl.style.display = 'block';
      resultEl.innerHTML = `<p class="muted">${WisecallI18n.t('auth.reset.success')}</p><a class="btn btn-primary btn-block" href="/login.html" style="margin-top:14px">${WisecallI18n.t('auth.login.cta')}</a>`;
    } catch (e) {
      errorEl.textContent = e.code === 'invalid_or_expired' ? WisecallI18n.t('auth.reset.expired') : WisecallI18n.t('toast.error');
      submitBtn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
