# Dependabot: a weekly look for new versions of the npm packages and of the GitHub Actions used in .github/workflows.
# Security fixes come as soon as they are published, whatever the schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-tools:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
