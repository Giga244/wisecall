# On every push and pull request: npm audit (high and critical only), the unit and cloud tests against a throwaway Postgres, the browser
# tests, and a secret scan of the whole git history (gitleaks). Nothing here uses a real key: the tests run with the fake bank, the fake
# ID check and a mail log, and the database is created for the run and thrown away.
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wisecall
          POSTGRES_PASSWORD: ci-only-not-secret
          POSTGRES_DB: wisecall_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wisecall" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://wisecall:ci-only-not-secret@localhost:5432/wisecall_test
      DATABASE_URL: postgresql://wisecall:ci-only-not-secret@localhost:5432/wisecall_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit and cloud tests
        run: npm test
      - name: Browser for the end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Keep the browser test report when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/report
            e2e/results
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the whole history, every commit
      - name: gitleaks (whole history; findings are redacted in the log)
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest git /repo --redact --verbose --exit-code 1
