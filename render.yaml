# Optional Render Blueprint: New -> Blueprint, then pick this repository.
# Secrets (marked sync: false) are asked for in the Render dashboard, never stored here.
# Check the plan names against Render's current plans before applying.
databases:
  - name: wisecall-db
    databaseName: wisecall
    plan: basic-256mb
    region: frankfurt

services:
  - type: web
    name: wisecall
    runtime: node
    region: frankfurt
    plan: starter
    numInstances: 1
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: wisecall-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # Generated once here; copy it from the Render dashboard into your password manager.
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: PUBLIC_URL
        sync: false
      - key: PLATFORM_FEE_PERCENT
        value: "20"
      - key: ANSWER_DEADLINE_DAYS
        value: "7"
      - key: PAYOUT_HOLD_DAYS
        value: "7"
      - key: ADMIN_EMAILS
        sync: false
      - key: PAYMENT_PROVIDER
        sync: false        # bog or tbc
      - key: BOG_CLIENT_ID
        sync: false
      - key: BOG_CLIENT_SECRET
        sync: false
      - key: TBC_API_KEY
        sync: false
      - key: TBC_CLIENT_ID
        sync: false
      - key: TBC_CLIENT_SECRET
        sync: false
      - key: KYC_PROVIDER
        value: didit
      - key: DIDIT_API_KEY
        sync: false
      - key: DIDIT_WORKFLOW_ID
        sync: false
      - key: DIDIT_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
