# Optional Render Blueprint: New -> Blueprint, then pick this repository.
# Secrets (marked sync: false) are asked for in the Render dashboard, never stored here.
# Check the plan names against Render's current plans before applying.
#
# This starts the site in PRELAUNCH: it runs without any bank or ID-check (Didit) keys. Mentors can sign up and apply, visitors can
# join the waiting list, nobody can book or pay, and the ID-check step says "ID checks open soon". On launch day add, under
# Environment: PAYMENT_PROVIDER (bog or tbc) with its keys (BOG_CLIENT_ID + BOG_CLIENT_SECRET, or TBC_API_KEY + TBC_CLIENT_ID +
# TBC_CLIENT_SECRET), KYC_PROVIDER=didit with DIDIT_API_KEY, DIDIT_WORKFLOW_ID and DIDIT_WEBHOOK_SECRET, then change LAUNCH_MODE to
# live. With LAUNCH_MODE=live the server refuses to start without them (DEPLOY.md, "Going online first").
databases:
  - name: wisecall-db
    databaseName: wisecall
    plan: basic-256mb
    region: frankfurt

services:
  - type: web
    name: wisecall
    runtime: node
    region: frankfurt
    plan: starter
    numInstances: 1
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: LAUNCH_MODE
        value: prelaunch
      - key: DATABASE_URL
        fromDatabase:
          name: wisecall-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # Generated once here; copy it from the Render dashboard into your password manager.
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      # Your domain. Until its DNS points at Render, you can use the https://....onrender.com address instead.
      - key: PUBLIC_URL
        value: https://wisecallge.ge
      - key: PLATFORM_FEE_PERCENT
        value: "20"
      - key: ANSWER_DEADLINE_DAYS
        value: "7"
      - key: PAYOUT_HOLD_DAYS
        value: "7"
      - key: DISPUTE_DAYS
        value: "7"
      - key: LEGAL_NAME
        sync: false
      - key: LEGAL_ID
        sync: false
      - key: LEGAL_ADDRESS
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Wisecall <hello@wisecallge.ge>
      - key: SUPPORT_EMAIL
        value: support@wisecallge.ge
      # Mentor verification (rules v2): the AI review of applications, and whether it may approve by itself (off: a person approves).
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: AUTO_APPROVE
        value: "off"
