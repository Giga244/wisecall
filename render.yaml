# Optional Render Blueprint: New -> Blueprint, then pick this repository.
# Secrets (marked sync: false) are asked for in the Render dashboard, never stored here.
# Check the plan names against Render's current plans before applying.
#
# This starts the site in PRELAUNCH: it runs without any bank or ID-check (Didit) keys. Mentors can sign up and apply, visitors can
# join the waiting list, nobody can book or pay, and the ID-check step says "ID checks open soon". On launch day add, under
# Environment: PAYMENT_PROVIDER=flitt with FLITT_MERCHANT_ID + FLITT_SECRET_KEY (or bog / tbc with their keys; docs/BANK-GOLIVE.md),
# for payouts through Flitt PAYOUT_METHOD=flitt_iban + FLITT_PAYOUT_SECRET_KEY, KYC_PROVIDER=didit with DIDIT_API_KEY, DIDIT_WORKFLOW_ID and DIDIT_WEBHOOK_SECRET, then change LAUNCH_MODE to
# live. With LAUNCH_MODE=live the server refuses to start without them (DEPLOY.md, "Going online first").
databases:
  - name: wisecall-db
    databaseName: wisecall
    plan: basic-256mb
    region: frankfurt

services:
  - type: web
    name: wisecall
    runtime: node
    region: frankfurt
    plan: starter
    numInstances: 1
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: LAUNCH_MODE
        value: prelaunch
      # Live sessions stay switched off at launch (no page, link or email about them); "on" turns them on, nothing else changes.
      - key: LIVE_SESSIONS
        value: "off"
      # Node collects garbage before the plan's memory limit instead of being killed (512 MB on Starter; use 1536 on Standard).
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: DATABASE_URL
        fromDatabase:
          name: wisecall-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # Generated once here; copy it from the Render dashboard into your password manager.
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      # Your site's address (https://your-domain). Set in the dashboard, never here: the blueprint must not hold a domain, or a sync would
      # put an old one back after the site has moved (docs/DOMAIN-MOVE.md). Until the DNS points at Render, the https://....onrender.com
      # address works too.
      - key: PUBLIC_URL
        sync: false
      # The site's earlier domain(s) after a move, comma-separated: each is sent to PUBLIC_URL with a 301. Empty = no redirect.
      - key: OLD_DOMAINS
        sync: false
      - key: PLATFORM_FEE_PERCENT
        value: "20"
      - key: ANSWER_DEADLINE_DAYS
        value: "7"
      - key: PAYOUT_HOLD_DAYS
        value: "7"
      - key: DISPUTE_DAYS
        value: "7"
      - key: GOOGLE_SITE_VERIFICATION
        sync: false
      - key: BING_SITE_VERIFICATION
        sync: false
      - key: LEGAL_NAME
        sync: false
      - key: LEGAL_ID
        sync: false
      - key: LEGAL_ADDRESS
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      # Who is emailed when a user's save fails (server/saveAlerts.js); empty: the admins above.
      - key: ALERT_EMAIL
        sync: false
      # Flitt (docs/BANK-GOLIVE.md section 0): asked for here, set PAYMENT_PROVIDER=flitt on launch day.
      - key: FLITT_MERCHANT_ID
        sync: false
      - key: FLITT_SECRET_KEY
        sync: false
      - key: FLITT_PAYOUT_SECRET_KEY
        sync: false
      - key: BANK_FEE_PERCENT
        value: "2"
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      # (addresses on your own domain, verified at the email provider: set in the dashboard)
      - key: EMAIL_FROM
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      # Mentor verification (rules v2): the AI review of applications, and whether it may approve by itself (off: a person approves).
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: AUTO_APPROVE
        value: "off"
